[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-notification"
version = "0.1.0"
description = "Reusable notification package with queue, template, email, SMS, and provider abstractions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
]
test = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
