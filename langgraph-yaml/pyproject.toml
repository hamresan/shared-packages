[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langgraph-yaml"
version = "0.1.0.dev0"
description = "Declarative YAML topology for LangGraph StateGraph workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.14",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
  "pyright>=1.1.400,<2",
  "build>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
