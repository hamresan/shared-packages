[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-multi-auth-host-consumer-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hamresan-identity>=0.1.0,<1.0",
  "hamresan-integration-auth>=0.1.0,<1.0",
]

[project.optional-dependencies]
test = [
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_auth_host_consumer_app"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../identity/src", "../../integration_auth/src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../../identity/src", "../../integration_auth/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
