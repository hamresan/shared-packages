[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "hamresan-identity-business-consumer-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "hamresan-business[sqlalchemy]>=0.1.0a1,<1.0",
  "hamresan-identity>=0.2.1,<1.0",
  "hamresan-notification>=0.1.0,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20,<1.0", "httpx>=0.27,<1.0", "pytest>=8,<10",
        "pytest-asyncio>=0.24,<2.0", "ruff>=0.9,<1.0", "pyright>=1.1,<2.0"]

[tool.uv.sources]
hamresan-business = { path = "../../business" }
hamresan-identity = { path = "../../identity" }
hamresan-notification = { path = "../../notification" }

[tool.hatch.build.targets.wheel]
packages = ["src/identity_business_consumer_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../../business/src", "../../identity/src", "../../notification/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
