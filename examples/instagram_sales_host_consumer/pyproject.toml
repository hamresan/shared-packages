[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-instagram-sales-host-consumer-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.115,<1.0",
  "hamresan-identity>=0.1.0,<1.0",
  "hamresan-instagram-api>=0.1.0,<1.0",
  "hamresan-instagram-auth>=0.1.0,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_sales_host_consumer_app"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../../identity/src",
  "../../instagram_auth/src",
  "../../instagram_api/src",
]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = [
  "src",
  "../../identity/src",
  "../../instagram_auth/src",
  "../../instagram_api/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
