name: Identity CI

on:
  pull_request:
    paths:
      - "identity/**"
      - "notification/**"
      - ".github/workflows/identity-ci.yml"
  push:
    branches: [main]
    paths:
      - "identity/**"
      - "notification/**"
      - ".github/workflows/identity-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install notification package
        run: python -m pip install -e "./notification"
      - name: Install identity package
        run: python -m pip install -e "./identity[test]"
      - name: Lint
        working-directory: identity
        run: python -m ruff check .
      - name: Format check
        working-directory: identity
        run: python -m ruff format --check .
      - name: Typecheck
        working-directory: identity
        run: python -m pyright
      - name: Test with coverage
        working-directory: identity
        run: make coverage
