name: Subscription Consumer Integration CI

on:
  pull_request:
    paths:
      - "examples/subscription_consumer/**"
      - "subscription/**"
      - ".github/workflows/subscription-consumer-integration-ci.yml"
  push:
    branches: [main]
    paths:
      - "examples/subscription_consumer/**"
      - "subscription/**"
      - ".github/workflows/subscription-consumer-integration-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install subscription package
        run: python -m pip install -e "./subscription"
      - name: Install subscription consumer example
        run: python -m pip install -e "./examples/subscription_consumer[test]"
      - name: Run consumer quality gate
        working-directory: examples/subscription_consumer
        run: make check
