name: Subscription CI

on:
  pull_request:
    paths:
      - "subscription/**"
      - ".github/workflows/subscription-ci.yml"
  push:
    branches: [main]
    paths:
      - "subscription/**"
      - ".github/workflows/subscription-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install subscription package
        run: python -m pip install -e "./subscription[test]"
      - name: Run package quality gate
        working-directory: subscription
        run: make check
