name: Consumer Integration CI

on:
  pull_request:
    paths:
      - "examples/identity_notification_consumer/**"
      - "identity/**"
      - "notification/**"
      - ".github/workflows/consumer-integration-ci.yml"
  push:
    branches: [main]
    paths:
      - "examples/identity_notification_consumer/**"
      - "identity/**"
      - "notification/**"
      - ".github/workflows/consumer-integration-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install notification package
        run: python -m pip install -e "./notification"
      - name: Install identity package
        run: python -m pip install -e "./identity"
      - name: Install consumer example
        run: python -m pip install -e "./examples/identity_notification_consumer[test]"
      - name: Check consumer integration
        working-directory: examples/identity_notification_consumer
        run: make check
