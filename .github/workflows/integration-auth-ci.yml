name: Integration Auth CI

on:
  pull_request:
    paths:
      - "integration_auth/**"
      - ".github/workflows/integration-auth-ci.yml"
  push:
    branches: [main]
    paths:
      - "integration_auth/**"
      - ".github/workflows/integration-auth-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integration_auth/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: make check
