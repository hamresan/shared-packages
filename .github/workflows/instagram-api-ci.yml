name: Instagram API CI

on:
  pull_request:
    paths:
      - "instagram_api/**"
      - ".github/workflows/instagram-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "instagram_api/**"
      - ".github/workflows/instagram-api-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram_api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: make check
      - name: Verify wheel excludes tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("hamresan_instagram_api-*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any(name.startswith("tests/") for name in names)
          assert any(name == "instagram_api/__init__.py" for name in names)
          PY
