name: Business CI

on:
  pull_request:
    paths:
      - "business/**"
      - ".github/workflows/business-ci.yml"
  push:
    branches: [main]
    paths:
      - "business/**"
      - ".github/workflows/business-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: business_test
          POSTGRES_PASSWORD: business_test
          POSTGRES_DB: business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_test -d business_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUSINESS_TEST_POSTGRES_DSN: postgresql+asyncpg://business_test:business_test@127.0.0.1:5432/business_test
    defaults:
      run:
        working-directory: business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: business/uv.lock
      - name: Install locked test environment
        run: uv sync --extra test --locked
      - name: Verify lint, formatting, typing, coverage and distribution
        run: make check
      - name: Verify clean wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/business-wheel-check"
          "$RUNNER_TEMP/business-wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/business-wheel-check/bin/python" -c "from business import BranchAddress; assert BranchAddress(city='Muscat').city == 'Muscat'"
