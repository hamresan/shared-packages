name: Business CI

on:
  pull_request:
    paths:
      - "business/**"
      - "examples/identity_business_consumer/**"
      - ".github/workflows/business-ci.yml"
  push:
    branches: [main]
    paths:
      - "business/**"
      - "examples/identity_business_consumer/**"
      - ".github/workflows/business-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: business_test
          POSTGRES_PASSWORD: business_test
          POSTGRES_DB: business_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_test -d business_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUSINESS_TEST_POSTGRES_DSN: postgresql+asyncpg://business_test:business_test@127.0.0.1:5432/business_test
    defaults:
      run:
        working-directory: business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: business/uv.lock
      - name: Install locked test environment
        run: uv sync --extra test --locked
      - name: Verify lint, formatting, typing, coverage and distribution
        run: make check
      - name: Verify clean wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/business-wheel-check"
          "$RUNNER_TEMP/business-wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/business-wheel-check/bin/python" -c "from business import BranchAddress; assert BranchAddress(city='Muscat').city == 'Muscat'"
          "$RUNNER_TEMP/business-wheel-check/bin/python" -c "from business.bootstrap import BusinessApplicationFactory; from business.application import BusinessUseCases; assert BusinessApplicationFactory and BusinessUseCases"
          wheel_paths=(dist/hamresan_business-*.whl)
          uv pip install --python "$RUNNER_TEMP/business-wheel-check/bin/python" "${wheel_paths[0]}[fastapi,sqlalchemy]"
          "$RUNNER_TEMP/business-wheel-check/bin/python" -c "from business.bootstrap import BusinessApplicationFactory; from business.presentation import build_fastapi_business_adapter; from business.migrations import business_metadata; assert len(business_metadata().tables) == 5"
      - name: Install composed Identity/Notification/Business example
        working-directory: examples/identity_business_consumer
        run: uv sync --extra test --locked
      - name: Verify OTP/JWT integration and example typing
        working-directory: examples/identity_business_consumer
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pyright
          uv run --no-sync pytest -q
