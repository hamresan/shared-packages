name: Notification CI

on:
  pull_request:
    paths:
      - "notification/**"
      - ".github/workflows/notification-ci.yml"
  push:
    branches: [main]
    paths:
      - "notification/**"
      - ".github/workflows/notification-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e "./notification[test]"
      - name: Lint
        working-directory: notification
        run: ruff check .
      - name: Typecheck
        working-directory: notification
        run: python -m pyright
      - name: Test
        working-directory: notification
        run: pytest
