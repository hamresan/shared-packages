[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "hamresan-business"
version = "0.1.0a1"
description = "Reusable business, branch, and organization-membership foundations for Python applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3.0"]
postgres = ["sqlalchemy[asyncio]>=2.0,<3.0", "asyncpg>=0.30,<1.0"]
test = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "build>=1.2,<2.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/business"]
artifacts = ["src/business/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--cov=business --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["business"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
