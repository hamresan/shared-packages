[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-subscription"
version = "0.1.0"
description = "Reusable subscription, plan, entitlement, trial, and usage-management package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.14,<2.0",
  "build>=1.2,<2.0",
  "httpx>=0.28,<1.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/subscription"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=subscription --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["subscription"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
