[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-instagram-auth"
version = "0.1.0"
description = "Reusable Instagram OAuth and authorization package for Python applications."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_auth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=instagram_auth --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["instagram_auth"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
