[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-instagram-api"
version = "0.1.0"
description = "Reusable Instagram API integration package for Python applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
fastapi = [
  "build>=1.2,<2.0",
  "fastapi>=0.115,<1.0",
]
sqlalchemy = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
]
test = [
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.115,<1.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=instagram_api --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["instagram_api"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
