[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hamresan-identity"
version = "0.1.0"
description = "Reusable identity, passwordless authentication, session, and authorization package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "hamresan-notification>=0.1.0,<1.0",
  "pydantic>=2.8,<3.0",
  "PyJWT>=2.9,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
migrations = [
  "alembic>=1.14,<2.0",
]
test = [
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.27,<1.0",
  "pyright>=1.1,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../notification/src"]
testpaths = ["tests"]
addopts = "--cov=identity --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["identity"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../notification/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
